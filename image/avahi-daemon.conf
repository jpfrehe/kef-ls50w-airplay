# Template, rendered by entrypoint.sh (AVAHI_HOSTNAME, AVAHI_INTERFACES)
[server]
# Own host name: the host's name is usually also announced by other mDNS stacks on the host
# (Home Assistant / Music Assistant zeroconf), possibly with IPv6 addresses.
host-name=__AVAHI_HOSTNAME__
# Set via AVAHI_INTERFACES to announce only on the LAN interface, not on Docker bridges
#allow-interfaces=
use-ipv4=yes
# Announce IPv4 only: if the host firewall only allows the LAN over IPv4, iPhones connecting via
# IPv6 would be blocked and the receiver would appear but never play.
use-ipv6=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
# Only the shairport-sync services, no host information
publish-addresses=yes
publish-aaaa-on-ipv4=no
publish-a-on-ipv6=no
publish-hinfo=no
publish-workstation=no
publish-domain=yes

[reflector]
enable-reflector=no

[rlimits]
